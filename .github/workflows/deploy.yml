name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODEMP_SDK_DIR: ${{ github.workspace }}/sdk
      NODEMP_SERVER_DIR: ${{ github.workspace }}/server
      NODEMP_LAUNCHER_DIR: ${{ github.workspace }}/launcher
      NODEMP_MOD_DIR: ${{ github.workspace }}/NodeMP
      NODEMP_UI_LAUNCHER_DIR: ${{ github.workspace }}/UI-launcher
      IMPORT_API_STRICT: "1"
    steps:
      - uses: actions/checkout@v5
      # The sdk builds the API reference; the server, the launcher, the client mod
      # and the launcher interface are what check-claims (npm run check) compares
      # the pages with. All on main, one read-only deploy key each.
      - name: Checkout sdk (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: NodeMP-BeamNG/sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
          path: sdk
          persist-credentials: false
      - name: Checkout server (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: NodeMP-BeamNG/server
          ssh-key: ${{ secrets.SERVER_DEPLOY_KEY }}
          path: server
          persist-credentials: false
      - name: Checkout launcher (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: NodeMP-BeamNG/launcher
          ssh-key: ${{ secrets.LAUNCHER_DEPLOY_KEY }}
          path: launcher
          persist-credentials: false
      - name: Checkout NodeMP, the client mod (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: NodeMP-BeamNG/NodeMP
          ssh-key: ${{ secrets.MOD_DEPLOY_KEY }}
          path: NodeMP
          persist-credentials: false
      - name: Checkout UI-launcher (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: NodeMP-BeamNG/UI-launcher
          ssh-key: ${{ secrets.UI_LAUNCHER_DEPLOY_KEY }}
          path: UI-launcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The plugin guides' Lua examples against the released server, as in ci.yml; a page whose
  # example broke is not published.
  doctest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_VERSION: "1.2.0"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs
          POSTGRES_DB: docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lua5.4 (the syntax checks) and zstandard (the fake player's frames)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4
          python -m pip install --quiet zstandard
      - name: Download Node-Server ${{ env.SERVER_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p .server
          cd .server
          asset="Node-Server-${SERVER_VERSION}-linux-x64.tar.gz"
          base="https://github.com/NodeMP-BeamNG/releases/releases/download/server-v${SERVER_VERSION}"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$asset.sha256" "$base/$asset.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          chmod +x Node-Server
          ./Node-Server --version
      - name: Checkout the server's run/ helpers (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: NodeMP-BeamNG/server
          ssh-key: ${{ secrets.SERVER_DEPLOY_KEY }}
          path: server
          sparse-checkout: run
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - run: python scripts/doctest/run.py --self-test
      - name: Run the examples
        env:
          DOCTEST_SERVER: ${{ github.workspace }}/.server/Node-Server
          NODEMP_SERVER_DIR: ${{ github.workspace }}/server
          NODE_DATABASE_URL: postgres://docs:docs@127.0.0.1:5432/docs
        run: python scripts/doctest/run.py --strict
      - name: Upload the server logs of the failed pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctest-server-logs
          path: |
            .doctest/*/server.log
            .doctest/*/received.log
          include-hidden-files: true  # .doctest/ is a dot-directory
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [build, doctest]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
